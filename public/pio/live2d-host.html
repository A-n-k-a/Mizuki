<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<script src="/pio/l2d-widget.min.js"></script>
<script>
  var widgetInstance = null;
  var activeConfigKey = '';
  var loadingConfigKey = '';
  var lastContentHeight = 500;
  var lastReportedHeight = 0;
  var measureRaf = 0;
  var measureTimer = null;
  var mutationObserver = null;
  var resizeObserver = null;
  var animationWatchUntil = 0;
  var animationHeadroom = 10;

  var menuActions = {
    home: function() { parent.postMessage({ type: 'l2d-action', action: 'home' }, '*'); },
    scrollToTop: function() { parent.postMessage({ type: 'l2d-action', action: 'scrollToTop' }, '*'); },
    sleep: function(w) { w.sleep(); },
  };

  function hasVisibleColor(value) {
    return value && value !== 'transparent' && value !== 'rgba(0, 0, 0, 0)';
  }

  function measureContentHeight() {
    var minTop = Infinity;
    var maxBottom = 0;
    document.querySelectorAll('*').forEach(function(el) {
      var tagName = el.tagName ? el.tagName.toLowerCase() : '';
      if (
        !el.getBoundingClientRect ||
        ['html', 'body', 'head', 'script', 'style', 'link', 'meta'].indexOf(tagName) !== -1
      ) {
        return;
      }

      var style = window.getComputedStyle(el);
      if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) {
        return;
      }

      var r = el.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) return;

      var isViewportContainer =
        r.top <= 0 &&
        r.left <= 0 &&
        r.width >= window.innerWidth &&
        r.height >= window.innerHeight;
      var hasOwnText = Array.prototype.some.call(el.childNodes, function(node) {
        return node.nodeType === Node.TEXT_NODE && Boolean(node.textContent && node.textContent.trim());
      });
      var hasVisibleBox =
        hasVisibleColor(style.backgroundColor) ||
        style.backgroundImage !== 'none' ||
        style.boxShadow !== 'none' ||
        parseFloat(style.borderTopWidth) > 0 ||
        parseFloat(style.borderRightWidth) > 0 ||
        parseFloat(style.borderBottomWidth) > 0 ||
        parseFloat(style.borderLeftWidth) > 0;
      var hasOwnVisibleSurface =
        tagName === 'canvas' ||
        tagName === 'button' ||
        tagName === 'a' ||
        tagName === 'img' ||
        hasOwnText ||
        hasVisibleBox;

      if (isViewportContainer || !hasOwnVisibleSurface) return;

      minTop = Math.min(minTop, r.top);
      maxBottom = Math.max(maxBottom, r.bottom);
    });

    return maxBottom > 0 && minTop < Infinity
      ? Math.ceil(maxBottom - minTop + animationHeadroom)
      : lastContentHeight || 500;
  }

  function notifyLoaded(force) {
    lastContentHeight = measureContentHeight();
    if (!force && Math.abs(lastContentHeight - lastReportedHeight) <= 1) return;
    lastReportedHeight = lastContentHeight;
    parent.postMessage({ type: 'l2d-loaded', contentHeight: lastContentHeight }, '*');
  }

  function scheduleNotify(force) {
    if (measureRaf) return;
    measureRaf = requestAnimationFrame(function() {
      measureRaf = 0;
      notifyLoaded(force);
      if (Date.now() < animationWatchUntil) {
        scheduleNotify(false);
      }
    });
  }

  function watchAnimationFrames(duration) {
    animationWatchUntil = Math.max(animationWatchUntil, Date.now() + duration);
    scheduleNotify(false);
  }

  function startGeometryWatch() {
    if (!mutationObserver) {
      mutationObserver = new MutationObserver(function() {
        watchAnimationFrames(1200);
      });
      mutationObserver.observe(document.body, {
        attributes: true,
        childList: true,
        characterData: true,
        subtree: true,
      });
    }

    if (!resizeObserver && window.ResizeObserver) {
      resizeObserver = new ResizeObserver(function() {
        watchAnimationFrames(600);
      });
      resizeObserver.observe(document.body);
    }

    if (!measureTimer) {
      measureTimer = setInterval(function() {
        scheduleNotify(false);
      }, 500);
    }
  }

  function hideAboutMenu() {
    if (document.getElementById('l2d-hide-about')) return;
    var style = document.createElement('style');
    style.id = 'l2d-hide-about';
    style.textContent = 'button[title="About"] { display: none !important; }';
    document.head.appendChild(style);
  }

  function destroyWidget() {
    if (!widgetInstance) return;
    try {
      widgetInstance.destroy();
    } catch (err) {
      console.error('Failed to destroy Live2D widget:', err);
    }
    widgetInstance = null;
  }

  window.addEventListener('message', function(e) {
    if (e.data.type !== 'l2d-init') return;
    var config = e.data.config;
    var configKey = JSON.stringify(config);

    if (widgetInstance && activeConfigKey === configKey) {
      startGeometryWatch();
      notifyLoaded(true);
      return;
    }

    if (loadingConfigKey === configKey) {
      return;
    }

    loadingConfigKey = configKey;
    if (widgetInstance) {
      destroyWidget();
    }

    if (config.menus && config.menus.items) {
      config.menus.items = config.menus.items.map(function(item) {
        return {
          icon: item.icon,
          label: item.label,
          onClick: menuActions[item.action] || function() {}
        };
      });
    }

    try {
      widgetInstance = L2D_WIDGET.createWidget(config);
      activeConfigKey = configKey;
    } catch (err) {
      loadingConfigKey = '';
      activeConfigKey = '';
      console.error('Failed to initialize Live2D widget:', err);
      return;
    }
    loadingConfigKey = '';

    if (config._hideAbout) {
      hideAboutMenu();
    }

    var notified = false;
    function notifyOnce() {
      if (notified) return;
      notified = true;
      startGeometryWatch();
      notifyLoaded(true);
    }

    var checkInterval = setInterval(function() {
      var canvas = document.querySelector('canvas');
      if (canvas && canvas.width > 0 && canvas.height > 0) {
        clearInterval(checkInterval);
        setTimeout(notifyOnce, 300);
      }
    }, 200);

    setTimeout(function() {
      clearInterval(checkInterval);
      loadingConfigKey = '';
      notifyOnce();
    }, 15000);
  });
</script>
</body>
</html>
